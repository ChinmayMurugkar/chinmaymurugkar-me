dasharray=""></rect><text x="355" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Offline, multi-device</text><circle cx="260" cy="45" r="11" fill="#1f4fd8"></circle><text x="260" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">2</text><rect x="25" y="105" width="210" height="44" rx="10" fill="#bcd0ff" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="130" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Groups up to 1,000</text><circle cx="35" cy="105" r="11" fill="#1f4fd8"></circle><text x="35" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">3</text><rect x="250" y="105" width="210" height="44" rx="10" fill="#bcd0ff" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="355" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Sent, delivered, read</text><circle cx="260" cy="105" r="11" fill="#1f4fd8"></circle><text x="260" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">4</text><text x="25" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#4d4e48" font-family="Inter, Helvetica, Arial">Each forces a part of the design.</text><text x="25" y="208" text-anchor="start" font-size="12" font-weight="400" fill="#4d4e48" font-family="Inter, Helvetica, Arial">The deep dives come from these four.</text><rect x="515" y="40" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="620" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Presence (light)</text><rect x="740" y="40" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="845" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Media by reference</text><rect x="515" y="86" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="620" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Voice and video</text><rect x="740" y="86" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="845" y="109" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">End-to-end encryption</text><rect x="515" y="132" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="620" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Search</text><rect x="740" y="132" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="845" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Channels of 100K+</text><rect x="515" y="178" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="620" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Bots, integrations</text><rect x="740" y="178" width="210" height="36" rx="10" fill="#fff" stroke="#221c22" stroke-width="1.6" stroke-dasharray="5 4"></rect><text x="845" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Edits and deletes</text></svg>