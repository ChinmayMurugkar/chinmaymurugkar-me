<svg viewBox="0 0 980 215" xmlns="http://www.w3.org/2000/svg" width="980" height="215"><rect width="100%" height="100%" fill="#ffffff"></rect><defs><marker id="acontracts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#221c22"></path></marker><marker id="rcontracts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2401a"></path></marker><marker id="bcontracts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"></path></marker><marker id="pcontracts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4bc4"></path></marker></defs><rect x="10" y="10" width="470" height="195" rx="14" fill="#fff4f0" stroke="#f0c0b1" stroke-dasharray="6 5"></rect><text x="22" y="28" text-anchor="start" font-size="10" font-weight="700" fill="#77786f" font-family="Menlo, monospace">THE MESSAGE PATH</text><rect x="500" y="10" width="470" height="195" rx="14" fill="#f2f6ff" stroke="#c6d3f5" stroke-dasharray="6 5"></rect><text x="512" y="28" text-anchor="start" font-size="10" font-weight="700" fill="#77786f" font-family="Menlo, monospace">DISPLAY, CONNECTIONS AND SYNC</text><rect x="25" y="40" width="140" height="150" rx="10" fill="#fff" stroke="#c2401a" stroke-width="1.4"></rect><text x="95" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#c2401a" font-family="Inter, Helvetica, Arial">500 ms</text><text x="95" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">online delivery</text><text x="95" y="146" text-anchor="middle" font-size="11" font-weight="400" fill="#55564f" font-family="Inter, Helvetica, Arial">p99, one region</text><rect x="177" y="40" width="140" hei