ies</text><polyline points="300,179 340,179" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><polyline points="620,179 660,179" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><rect x="20" y="222" width="280" height="54" rx="10" fill="#fbdcd4" stroke="#c2401a" stroke-width="1.6" stroke-dasharray=""></rect><text x="160" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Session registry lost</text><rect x="340" y="222" width="280" height="54" rx="10" fill="#ebe8df" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="480" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">push instead of live</text><rect x="660" y="222" width="300" height="54" rx="10" fill="#bfe8cf" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="810" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">re-register on heartbeat</text><polyline points="300,249 340,249" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><polyline points="620,249 660,249" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><rect x="20" y="292" width="280" height="54" rx="10" fill="#fbdcd4" stroke="#c2401a" stroke-width="1.6" stroke-dasharray=""></rect><text x="160" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">APNs or FCM degraded</text><rect x="340" y="292" width="280" height="54" rx="10" fill="#ebe8df" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="480" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">offline users told late</text><rect x="660" y="292" width="300" height="54" rx="10" fill="#ffe8a3" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="810" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">sync on open still works</text><polyline points="300,319 340,319" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><polyline points="620,319 660,319" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><text x="20" y="365" text-anchor="start" font-size="12" font-weight="400" fill="#4d4e48" font-family="Inter, Helvetica, Arial">Green: contained by design. Yellow: users notice, but nothing is lost.</text></svg>