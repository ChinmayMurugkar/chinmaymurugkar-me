<svg viewBox="0 0 980 370" xmlns="http://www.w3.org/2000/svg" width="980" height="370"><rect width="100%" height="100%" fill="#ffffff"></rect><defs><marker id="afail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#221c22"></path></marker><marker id="rfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2401a"></path></marker><marker id="bfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"></path></marker><marker id="pfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4bc4"></path></marker></defs><rect x="20" y="12" width="280" height="54" rx="10" fill="#fbdcd4" stroke="#c2401a" stroke-width="1.6" stroke-dasharray=""></rect><text x="160" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">A gateway host dies</text><rect x="340" y="12" width="280" height="54" rx="10" fill="#ebe8df" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="480" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">100K users drop briefly</text><rect x="660" y="12" width="300" height="54" rx="10" fill="#bfe8cf" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="810" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">jittered reconnect, headroom</text><polyline points="300,39 340,39" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></polyline><polyline points="620,39 660,39" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#afail)"></p