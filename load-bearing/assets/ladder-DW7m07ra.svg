<svg viewBox="0 0 980 270" xmlns="http://www.w3.org/2000/svg" width="980" height="270"><rect width="100%" height="100%" fill="#ffffff"></rect><defs><marker id="aladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#221c22"></path></marker><marker id="rladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2401a"></path></marker><marker id="bladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"></path></marker><marker id="pladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4bc4"></path></marker></defs><rect x="20" y="30" width="175" height="56" rx="10" fill="#ebe8df" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="107.5" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Typing indicators</text><text x="107.5" y="72" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">dropped first</text><circle cx="32" cy="30" r="11" fill="#1f4fd8"></circle><text x="32" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">1</text><polyline points="195,58 210,58 210,93" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aladder)"></polyline><rect x="210" y="65" width="175" height="56" rx="10" fill="#ebe8df" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="297.5" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Presence</text><text x="297.5" y="107" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">coarse, then off</text><circle cx="222" cy="65" r="11" fill="#1f4fd8"></circle><text x="222" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">2</text><polyline points="385,93 400,93 400,128" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aladder)"></polyline><rect x="400" y="100" width="175" height="56" rx="10" fill="#ffe8a3" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="487.5" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Read receipts</text><text x="487.5" y="142" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">batched, delayed</text><circle cx="412" cy="100" r="11" fill="#1f4fd8"></circle><text x="412" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">3</text><polyline points="575,128 590,128 590,163" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aladder)"></polyline><rect x="590" y="135" width="175" height="56" rx="10" fill="#ffe8a3" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="677.5" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">History, search</text><text x="677.5" y="177" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">older pages slower</text><circle cx="602" cy="135" r="11" fill="#1f4fd8"></circle><text x="602" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">4</text><polyline points="765,163 780,163 780,198" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aladder)"></polyline><rect x="780" y="170" width="175" height="56" rx="10" fill="#bfe8cf" stroke="#c2401a" stroke-width="2.4" stroke-dasharray=""></rect><text x="867.5" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Send and deliver</text><text x="867.5" y="212" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">never shed</text><circle cx="792" cy="170" r="11" fill="#1f4fd8"></circle><text x="792" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">5</text><text x="20" y="245" text-anchor="start" font-size="12" font-weight="400" fill="#4d4e48" font-family="Inter, Helvetica, Arial">Each step has a switch built in advance, so on-call can shed load in seconds without a deploy.</text></svg>