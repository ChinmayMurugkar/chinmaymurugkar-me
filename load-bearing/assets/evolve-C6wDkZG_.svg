<svg viewBox="0 0 980 150" xmlns="http://www.w3.org/2000/svg" width="980" height="150"><rect width="100%" height="100%" fill="#ffffff"></rect><defs><marker id="aevolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#221c22"></path></marker><marker id="revolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2401a"></path></marker><marker id="bevolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"></path></marker><marker id="pevolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4bc4"></path></marker></defs><rect x="20" y="40" width="170" height="62" rx="10" fill="#a8ecd9" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="105" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">One region, groups</text><text x="105" y="85" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">trigger: launch</text><circle cx="32" cy="40" r="11" fill="#1f4fd8"></circle><text x="32" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">1</text><polyline points="190,71 210,71" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aevolve)"></polyline><rect x="210" y="40" width="170" height="62" rx="10" fill="#ffd0b0" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="295" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Read-fanout channels</text><text x="295" y="85" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">groups over 1,000</text><circle cx="222" cy="40" r="11" fill="#1f4fd8"></circle><text x="222" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">2</text><polyline points="380,71 400,71" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aevolve)"></polyline><rect x="400" y="40" width="170" height="62" rx="10" fill="#bcd0ff" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="485" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Second region</text><text x="485" y="85" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">latency or residency</text><circle cx="412" cy="40" r="11" fill="#1f4fd8"></circle><text x="412" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">3</text><polyline points="570,71 590,71" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aevolve)"></polyline><rect x="590" y="40" width="170" height="62" rx="10" fill="#d9c8f7" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="675" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">Cells per region</text><text x="675" y="85" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">blast radius too big</text><circle cx="602" cy="40" r="11" fill="#1f4fd8"></circle><text x="602" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">4</text><polyline points="760,71 780,71" fill="none" stroke="#221c22" stroke-width="1.8" stroke-dasharray="" marker-end="url(#aevolve)"></polyline><rect x="780" y="40" width="170" height="62" rx="10" fill="#ffe8a3" stroke="#221c22" stroke-width="1.6" stroke-dasharray=""></rect><text x="865" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#221c22" font-family="Inter, Helvetica, Arial">E2E encryption</text><text x="865" y="85" text-anchor="middle" font-size="11" fill="#55564f" font-family="Inter, Helvetica, Arial">a product decision</text><circle cx="792" cy="40" r="11" fill="#1f4fd8"></circle><text x="792" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter, Helvetica, Arial">5</text><text x="20" y="135" text-anchor="start" font-size="12" font-weight="400" fill="#4d4e48" font-family="Inter, Helvetica, Arial">Each step costs people to run it, so it waits for its trigger.</text></svg>