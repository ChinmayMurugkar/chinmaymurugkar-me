<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="orb" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2b3a7a"/>
      <stop offset="55%" stop-color="#101a3d"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="84" fill="url(#orb)" stroke="url(#ring)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.6"/>

  <text x="100" y="94" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="34"
        letter-spacing="2" fill="#eef1ff">TECH</text>
  <text x="100" y="128" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="30"
        letter-spacing="1" fill="url(#ring)">Talks</text>
</svg>
